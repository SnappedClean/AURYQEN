<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0d1119"><meta name="description" content="BizBench — visual business simulation workbench"><title>BizBench — Business Simulation</title>
<style>
:root{font-family:Inter,system-ui,-apple-system,sans-serif;background:#0d1119;color:#edf2fa;color-scheme:dark;--line:#2c394b;--muted:#95a5b8;--accent:#24ddb0;--purple:#a48aff}*{box-sizing:border-box}body{margin:0}button,input,select{font:inherit}button{cursor:pointer;color:inherit;border:1px solid #344357;background:#1a2533;border-radius:8px;padding:9px 12px;font-size:12px}button:hover{border-color:#ad92ff}button:disabled{opacity:.4;cursor:not-allowed}input,select{width:100%;min-width:0;color:#e6eefa;background:#0c1724;border:1px solid #344659;padding:9px;border-radius:7px;font-size:12px}button:focus-visible,input:focus-visible,select:focus-visible{outline:2px solid #b59bff;outline-offset:2px}.top{height:65px;display:flex;align-items:center;justify-content:space-between;gap:15px;padding:0 18px;background:#111923;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5}.brand{display:flex;align-items:center;gap:10px}.mark{font-size:33px;color:#b69cff}.brand b{display:block;font-size:19px}.brand small{color:var(--muted);font-size:9px;letter-spacing:1px}.beta{font-size:9px;color:#c3b2ff;border:1px solid #635380;padding:3px 7px;border-radius:12px}.tabs{display:flex;border:1px solid var(--line);border-radius:9px;padding:3px}.tabs button{border:0;background:transparent}.tabs .on{background:#303c4b}.actions{display:flex;align-items:center;gap:7px}.actions select{width:165px}.primary{background:linear-gradient(100deg,#20dfb0,#00bea0);color:#07382a;border:0;font-weight:800}.layout{display:grid;grid-template-columns:220px minmax(0,1fr) 294px;min-height:calc(100vh - 65px)}.side{background:#111a24;border-right:1px solid var(--line);padding:16px 11px}.side h3{font-size:12px;margin:8px 6px 17px}.side h4{font-size:10px;color:#91a3b6;font-weight:500;margin:20px 8px 9px}.palette{display:flex;width:100%;align-items:center;gap:11px;text-align:left;margin:5px 0;background:#1a2532;border:0}.palette i{font-style:normal;font-size:21px;color:#aebeff;width:24px}.palette strong{font-size:11px;display:block}.palette small{font-size:9px;color:var(--muted);display:block;margin-top:4px}.main{min-width:0}.workspace-head{padding:16px 18px;display:flex;align-items:center;justify-content:space-between;gap:10px;border-bottom:1px solid var(--line)}.eyebrow{font-size:9px;letter-spacing:1.4px;color:#8d9caf;font-weight:800}.workspace-head h1{font-size:18px;margin:5px 0 0}.workspace-head span:last-child{font-size:10px;color:#6fe5c2}.canvas{height:420px;overflow:auto;background-color:#0c1520;background-image:radial-gradient(#2c3b4b .85px,transparent .85px);background-size:20px 20px}.scene{position:relative;width:1110px;height:540px}.scene svg{position:absolute;width:1110px;height:540px;inset:0;pointer-events:none}.wire{fill:none;stroke:#8d83cd;stroke-width:2}.node{position:absolute;width:195px;height:85px;text-align:left;padding:11px 13px;border:1px solid #6e94c2;border-radius:10px;background:linear-gradient(135deg,#1b3043,#15202d);box-shadow:0 8px 22px #0005;touch-action:none;user-select:none}.node.sel{outline:2px solid #d2bdff;outline-offset:2px}.node.offer{border-color:#a678e5;background:linear-gradient(135deg,#2d2440,#1b2231)}.node.demand,.node.result{border-color:#38c6a3;background:linear-gradient(135deg,#173b33,#17252d)}.node.cost{border-color:#dd9875;background:linear-gradient(135deg,#3d2925,#1d2530)}.node .type{font-size:9px;text-transform:uppercase;color:#a4b7d0;letter-spacing:.8px}.node b{display:block;font-size:12px;margin:9px 0 3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.node small{color:#c0cadd;font-size:10px}.port{position:absolute;width:8px;height:8px;border-radius:50%;background:#ad9df7;top:40px;right:-5px}.node.result .port{display:none}.canvasfooter{padding:9px 16px;font-size:10px;color:#8699ad;border-top:1px solid var(--line)}.inspector{border-left:1px solid var(--line);background:#151f2b;height:calc(100vh - 65px);position:sticky;top:65px;display:flex;flex-direction:column}.inspector h2{font-size:16px;padding:18px;margin:0;border-bottom:1px solid var(--line)}.edit{overflow:auto;padding:13px;flex:1}.edit h4{font-size:11px;margin:15px 2px 10px}.fields{display:grid;grid-template-columns:1fr 1fr;gap:9px}.field{font-size:10px;color:#a4b4c6}.field input,.field select{margin-top:6px}.field.wide{grid-column:span 2}.costitem{padding:10px;background:#1b2a39;border:1px solid #344355;border-radius:8px;margin-bottom:8px}.costitem .fields{margin-top:8px}.note{font-size:10px;color:#8fa4b9;line-height:1.65;margin:15px 1px}.foot{padding:15px;font-size:10px;color:#6bdfaF;border-top:1px solid var(--line)}.report{padding:14px;display:grid;gap:12px}.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:9px}.kpi,.panel{border:1px solid var(--line);background:#162130;border-radius:10px;padding:14px}.kpi span{display:block;color:#9eacc1;font-size:10px}.kpi b{font-size:24px;display:block;margin:8px 0}.kpi small{font-size:9px;color:#56d5b2}.neg{color:#ff938d!important}.panel h2{font-size:15px;margin:0}.panelhead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:12px}.panelhead small{color:#9caebf;font-size:10px}.progress{height:5px;background:#2e3d4a;border-radius:5px;overflow:hidden;margin:12px 0}.progress i{display:block;background:#2ddfaf;height:100%;transition:width .18s}.chart{width:100%;height:180px;display:block;background:#0f1926;border:1px solid #304050;border-radius:7px}.gridline{stroke:#35465b;stroke-width:1;stroke-dasharray:3 4}.line{stroke:#ad93ff;stroke-width:2.5;fill:none}.dot{fill:#b5a1ff}.tablewrap{max-height:255px;overflow:auto}table{width:100%;border-collapse:collapse;font-size:11px;white-space:nowrap}td,th{padding:10px;text-align:right;border-bottom:1px solid #2a3949}td:first-child,th:first-child{text-align:left}th{font-size:10px;color:#96a8bc}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row select{width:130px}.quiet{font-size:10px;color:var(--muted)}.compare{padding:24px}.comparegrid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.comp{border:1px solid var(--line);border-radius:10px;padding:18px;background:#182536}.comp p{display:flex;justify-content:space-between;border-bottom:1px solid var(--line);padding:11px 0;font-size:12px}.comp p span{color:var(--muted)}.empty{padding:35px;color:#95a9bd;text-align:center}.hidden{display:none!important}#toast{position:fixed;right:18px;bottom:20px;background:#1a4035;border:1px solid #39c59e;padding:12px 17px;border-radius:8px;font-size:11px;opacity:0;pointer-events:none;transition:.2s;z-index:10}#toast.show{opacity:1}@media(max-width:1200px){.layout{grid-template-columns:180px minmax(0,1fr) 265px}.top{padding:0 9px}.tabs button{padding:8px}.actions select{width:115px}.kpis{grid-template-columns:repeat(2,1fr)}}@media(max-width:880px){.top{height:auto;min-height:64px;flex-wrap:wrap;padding:8px}.tabs{order:3;width:100%;justify-content:center}.layout{grid-template-columns:1fr}.side{display:flex;flex-wrap:wrap;gap:4px;padding:8px}.side h3,.side h4,.palette small{display:none}.palette{width:auto;margin:0}.inspector{position:relative;top:0;height:auto;border-left:0}.edit{overflow:visible}.fields{grid-template-columns:repeat(4,1fr)}.canvas{height:335px}.comparegrid{grid-template-columns:1fr}}@media(max-width:500px){.brand small,.beta{display:none}.actions button:not(.primary){display:none}.workspace-head{flex-wrap:wrap}.fields{grid-template-columns:1fr 1fr}.kpis{grid-template-columns:1fr 1fr}.kpi b{font-size:19px}}
</style></head><body><div id="app"></div><div id="toast" role="status" aria-live="polite"></div>
<script>
(function(){
var KEY='bizbench-v1', F={daily:365/12,weekly:52/12,monthly:1,yearly:1/12},fmt=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD',maximumFractionDigits:0}).format(Number.isFinite(n)?n:0),num=n=>new Intl.NumberFormat('en-US',{maximumFractionDigits:1}).format(n||0),escape=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])),uid=()=>Math.random().toString(36).slice(2,10);
function start(){return {id:uid(),name:'Base scenario',business:{name:'My business',startingCash:2500,growth:2,tax:18,ownerHours:35,ownerRate:0,employees:0,employeeHours:35,wage:20,payroll:12,months:12,capacity:true},offers:[{id:'a',name:'On-site service',kind:'onsite',price:150,freq:10,period:'weekly',hours:1.5,admin:.25,travel:.5,miles:12,mpg:24,gas:3.5,wear:.12,materials:8,other:2,fee:3},{id:'b',name:'Digital membership',kind:'digital',price:29,freq:30,period:'monthly',hours:.05,admin:.03,travel:0,miles:0,mpg:24,gas:3.5,wear:0,materials:0,other:1,fee:3}],costs:[{id:'x',name:'Software',amount:79,period:'monthly'},{id:'y',name:'Insurance',amount:52,period:'monthly'},{id:'z',name:'Marketing',amount:250,period:'monthly'}],positions:{business:{x:25,y:200},a:{x:285,y:126},b:{x:285,y:270},demand:{x:548,y:80},operations:{x:548,y:260},cost:{x:802,y:130},result:{x:802,y:300}}};}
var data;try{data=JSON.parse(localStorage.getItem(KEY))}catch(e){}if(!data||!Array.isArray(data.scenarios)||!data.scenarios.length){var first=start();data={current:first.id,scenarios:[first]}}var s=data.scenarios.find(x=>x.id===data.current)||data.scenarios[0],selected='a',tab='build',rows=[],step=0,timer=null,paused=false,speed=1;
function save(){data.current=s.id;var n=data.scenarios.findIndex(x=>x.id===s.id);if(n>=0)data.scenarios[n]=JSON.parse(JSON.stringify(s));else data.scenarios.push(JSON.parse(JSON.stringify(s)));localStorage.setItem(KEY,JSON.stringify(data))}
function toast(t){var el=document.getElementById('toast');el.textContent=t;el.className='show';clearTimeout(toast.t);toast.t=setTimeout(()=>el.className='',3200)}
function sim(model){var b=model.business,out=[],cash=+b.startingCash,cum=0,carry={};model.offers.forEach(o=>carry[o.id]=0);for(var m=0;m<+b.months;m++){var growth=Math.pow(1+(+b.growth)/100,m),req=model.offers.map(o=>{var count=Math.max(0,(+o.freq)*F[o.period]*growth);return {o,count,h:(+o.hours)+(+o.admin)+(o.kind==='digital'?0:(+o.travel))}}),work=req.reduce((a,x)=>a+x.count*x.h,0),ownerCap=(+b.ownerHours)*52/12,teamCap=(+b.employees)*(+b.employeeHours)*52/12,cap=b.capacity&&work>0?Math.min(1,(ownerCap+teamCap)/work):1,rev=0,variable=0,hours=0,units=0,fuel=0;req.forEach(x=>{var o=x.o,w=x.count*cap+carry[o.id],qty=Math.floor(w+1e-8);carry[o.id]=w-qty;var fuelEach=o.kind==='digital'||!(+o.mpg)?0:(+o.miles)/(+o.mpg)*(+o.gas),wearEach=o.kind==='digital'?0:(+o.miles)*(+o.wear);rev+=qty*(+o.price);variable+=qty*((+o.materials)+(+o.other)+fuelEach+wearEach+(+o.price)*(+o.fee)/100);fuel+=qty*fuelEach;hours+=qty*x.h;units+=qty});var empHours=Math.min(teamCap,Math.max(0,hours-ownerCap)),pay=empHours*(+b.wage)*(1+(+b.payroll)/100),ownerPay=(hours-empHours)*(+b.ownerRate),fixed=model.costs.reduce((a,c)=>a+(+c.amount)*F[c.period],0),pre=rev-variable-pay-ownerPay-fixed,tax=Math.max(0,pre)*(+b.tax)/100,profit=pre-tax;cash+=profit;cum+=rev;out.push({month:m+1,revenue:rev,variable:variable,payroll:pay,ownerPay:ownerPay,fixed:fixed,tax:tax,profit:profit,cash:cash,hours:hours,units:units,fuel:fuel,cumulative:cum})}return out}
function total(r,k){return r.reduce((a,x)=>a+x[k],0)}
function field(label,path,key,value,type){return '<label class="field '+(type==='text'?'wide':'')+'">'+escape(label)+'<input data-path="'+escape(path)+'" data-key="'+key+'" type="'+(type||'number')+'" '+(type==='text'?'maxlength="100"':'min="0" step="any"')+' value="'+escape(value)+'"></label>'}
function select(label,path,key,val,opts){return '<label class="field">'+escape(label)+'<select data-path="'+escape(path)+'" data-key="'+key+'">'+opts.map(x=>'<option value="'+x[0]+'" '+(String(val)===x[0]?'selected':'')+'>'+x[1]+'</option>').join('')+'</select></label>'}
function group(name,content){return '<h4>'+name+'</h4><div class="fields">'+content+'</div>'}
function editor(){var b=s.business,o=s.offers.find(x=>x.id===selected),body='',title='';if(o){title=o.name;body=group('Offering',field('Name',o.id,'name',o.name,'text')+select('Delivery',o.id,'kind',o.kind,[['onsite','In person'],['digital','Digital'],['hybrid','Hybrid']])+field('Price per sale ($)',o.id,'price',o.price)+field('Sales frequency',o.id,'freq',o.freq)+select('Frequency unit',o.id,'period',o.period,[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly']]))+group('Hours / sale',field('Fulfillment',o.id,'hours',o.hours)+field('Administration',o.id,'admin',o.admin)+field('Travel',o.id,'travel',o.travel)+field('Round-trip miles',o.id,'miles',o.miles))+group('Variable costs / sale',field('Materials ($)',o.id,'materials',o.materials)+field('Other ($)',o.id,'other',o.other)+field('Processing fee (%)',o.id,'fee',o.fee)+field('Fuel price / gallon',o.id,'gas',o.gas)+field('Vehicle MPG',o.id,'mpg',o.mpg)+field('Vehicle wear / mile',o.id,'wear',o.wear))+'<p><button data-act="delete-offer">Remove offering</button></p>'}
else if(selected==='business'){title='Business settings';body=group('Profile',field('Business name','business','name',b.name,'text')+field('Starting cash ($)','business','startingCash',b.startingCash)+field('Estimated tax (%)','business','tax',b.tax)+select('Time horizon','business','months',b.months,[['12','12 months'],['24','24 months'],['36','36 months'],['60','60 months']]))}
else if(selected==='demand'){title='Demand & growth';body=group('Sales modeling',field('Monthly growth (%)','business','growth',b.growth)+select('Labor capacity limit','business','capacity',String(b.capacity),[['true','Enabled'],['false','Disabled']]))+'<p class="note">Frequency is an assumption, not actual orders. Growth compounds monthly.</p>'}
else if(selected==='operations'){title='Time & labor';body=group('Owner',field('Owner hours / week','business','ownerHours',b.ownerHours)+field('Owner pay / hour ($)','business','ownerRate',b.ownerRate))+group('Employees',field('Number of employees','business','employees',b.employees)+field('Hours / employee / week','business','employeeHours',b.employeeHours)+field('Employee wage / hour ($)','business','wage',b.wage)+field('Employer burden (%)','business','payroll',b.payroll))}
else if(selected==='cost'){title='Recurring expenses';body=s.costs.map(c=>'<div class="costitem">'+field('Cost name',c.id,'name',c.name,'text')+'<div class="fields">'+field('Amount ($)',c.id,'amount',c.amount)+select('Frequency',c.id,'period',c.period,[['daily','Daily'],['weekly','Weekly'],['monthly','Monthly'],['yearly','Yearly']])+'</div><button data-act="delete-cost" data-id="'+escape(c.id)+'">× Remove</button></div>').join('')+'<button data-act="add-cost">＋ Add expense</button>'}
else{title='Profit & cash flow';body='<p class="note">Run the simulation to see month-by-month projections. No real sales or bank transactions are involved.</p><button class="primary" data-act="run">▷ Run simulation</button>'}return '<aside class="inspector"><h2>'+escape(title)+'</h2><div class="edit">'+body+'</div><div class="foot">● Saved locally in your browser</div></aside>'}
function graph(){var n=[{id:'business',type:'business',title:s.business.name,sub:'Company assumptions'}].concat(s.offers.map(o=>({id:o.id,type:'offer',title:o.name,sub:fmt(+o.price)+' · '+o.freq+'/'+o.period})),[{id:'demand',type:'demand',title:'Demand / frequency',sub:s.business.growth+'% monthly growth'},{id:'operations',type:'operations',title:'Time / labor',sub:s.business.ownerHours+' owner hrs / week'},{id:'cost',type:'cost',title:'Expenses & payroll',sub:s.costs.length+' recurring expenses'},{id:'result',type:'result',title:'Revenue & profit',sub:'Projection outputs'}]);var p=s.positions,edges=[];s.offers.forEach(o=>{edges.push(['business',o.id],[o.id,'demand'],[o.id,'operations'])});edges.push(['demand','result'],['operations','cost'],['cost','result']);var wires=edges.map(pair=>{var a=p[pair[0]],b=p[pair[1]];if(!a||!b)return '';var x1=a.x+195,y1=a.y+42,x2=b.x,y2=b.y+42;return '<path class="wire" d="M'+x1+' '+y1+' C'+(x1+60)+' '+y1+' '+(x2-60)+' '+y2+' '+x2+' '+y2+'"/>'}).join('');return '<section><div class="workspace-head"><div><span class="eyebrow">01 / VISUAL BUSINESS MODEL</span><h1>'+escape(s.business.name)+'</h1></div><span>● Local workbench</span></div><div class="canvas"><div class="scene" id="scene"><svg viewBox="0 0 1110 540" id="wires">'+wires+'</svg>'+n.map(x=>{var at=p[x.id]||{x:280,y:380};return '<button class="node '+x.type+(selected===x.id?' sel':'')+'" data-node="'+escape(x.id)+'" style="left:'+Number(at.x)+'px;top:'+Number(at.y)+'px"><span class="type">'+escape(x.type)+'</span><b>'+escape(x.title)+'</b><small>'+escape(x.sub)+'</small><i class="port"></i></button>'}).join('')+'</div></div><div class="canvasfooter">↖ Drag nodes to arrange · Click any node to edit its assumptions · '+s.offers.length+' revenue streams</div></section>'}
function chart(r){if(!r.length)return '<div class="empty">Run the model to watch monthly revenue and profit unfold.</div>';var w=900,h=180,l=46,t=14,bot=26,values=r.map(x=>x.revenue),hi=Math.max(1,...values),x=i=>l+(w-l-18)*(r.length===1?.5:i/(r.length-1)),y=v=>t+(h-t-bot)*(1-v/hi),path=r.map((a,i)=>(i?'L':'M')+x(i)+','+y(a.revenue)).join(' ');return '<svg class="chart" viewBox="0 0 900 180" aria-label="Monthly revenue line chart" role="img">'+[0,.25,.5,.75,1].map(v=>'<line class="gridline" x1="'+l+'" x2="880" y1="'+y(hi*v)+'" y2="'+y(hi*v)+'"/>').join('')+'<path class="line" d="'+path+'"/>'+r.map((a,i)=>'<circle class="dot" cx="'+x(i)+'" cy="'+y(a.revenue)+'" r="3"><title>Month '+a.month+': '+fmt(a.revenue)+'</title></circle>').join('')+'</svg>'}
function report(){var r=rows.slice(0,step),revenue=total(r,'revenue'),profit=total(r,'profit'),hours=total(r,'hours'),units=total(r,'units');return '<div class="report"><section class="panel"><div class="panelhead"><div><span class="eyebrow">02 / SIMULATION</span><h2>Live financial projection</h2></div><div class="row"><span class="quiet">'+(timer?(paused?'Paused':'● Running'):step===+s.business.months?'Complete':'Ready')+' · Month '+step+'/'+s.business.months+'</span><button data-act="pause" '+(!timer?'disabled':'')+'>'+(paused?'▷ Resume':'Ⅱ Pause')+'</button><button data-act="stop" '+(!timer?'disabled':'')+'>■ Stop</button></div></div><div class="progress"><i style="width:'+(100*step/(+s.business.months))+'%"></i></div><div class="kpis">'+[['Revenue',fmt(revenue)],['Net profit',fmt(profit)],['Hours',num(hours)+' h'],['Sales',num(units)]].map(x=>'<div class="kpi"><span>'+x[0]+'</span><b>'+x[1]+'</b><small>Projected to date</small></div>').join('')+'</div></section><section class="panel"><div class="panelhead"><h2>Revenue over time</h2><small>Model projection · not actual transactions</small></div>'+chart(r)+'</section><section class="panel"><div class="panelhead"><h2>Monthly ledger</h2><button data-act="csv" '+(!r.length?'disabled':'')+'>⇩ Export CSV</button></div><div class="tablewrap"><table><thead><tr><th>Month</th><th>Sales</th><th>Revenue</th><th>Variable</th><th>Fixed</th><th>Payroll</th><th>Taxes</th><th>Profit</th><th>Cash</th></tr></thead><tbody>'+r.map(a=>'<tr><td>'+a.month+'</td><td>'+a.units+'</td><td>'+fmt(a.revenue)+'</td><td>'+fmt(a.variable)+'</td><td>'+fmt(a.fixed)+'</td><td>'+fmt(a.payroll+a.ownerPay)+'</td><td>'+fmt(a.tax)+'</td><td class="'+(a.profit<0?'neg':'')+'">'+fmt(a.profit)+'</td><td>'+fmt(a.cash)+'</td></tr>').join('')+'</tbody></table></div></section></div>'}
function compare(){var other=data.scenarios.find(x=>x.id!==s.id),cards=[s,other].filter(Boolean);return '<div class="compare"><h2>Compare scenarios</h2><p class="quiet">Duplicate a business model, edit its assumptions, then compare the projections.</p>'+(other?'<div class="comparegrid">'+cards.map(x=>{var r=sim(x);return '<div class="comp"><h3>'+escape(x.name)+'</h3><p><span>Revenue</span>'+fmt(total(r,'revenue'))+'</p><p><span>Profit</span>'+fmt(total(r,'profit'))+'</p><p><span>Hours</span>'+num(total(r,'hours'))+' h</p><p><span>Sales</span>'+num(total(r,'units'))+'</p></div>'}).join('')+'</div>':'<button class="primary" data-act="duplicate">＋ Duplicate scenario</button>')+'</div>'}
function render(){document.getElementById('app').innerHTML='<header class="top"><div class="brand"><span class="mark">◈</span><span><b>BizBench</b><small>DESIGN · SIMULATE · GROW</small></span><span class="beta">BETA</span></div><nav class="tabs">'+['build','results','compare'].map(t=>'<button data-tab="'+t+'" class="'+(tab===t?'on':'')+'">'+t[0].toUpperCase()+t.slice(1)+'</button>').join('')+'</nav><div class="actions"><select id="scenario">'+data.scenarios.map(x=>'<option value="'+escape(x.id)+'" '+(x.id===s.id?'selected':'')+'>'+escape(x.name)+'</option>').join('')+'</select><button data-act="duplicate" title="Duplicate scenario">⧉</button><button data-act="export" title="Export scenario JSON">⇩</button><button class="primary" data-act="run">▷ Run</button></div></header><div class="layout"><aside class="side"><h3>NODE LIBRARY</h3><h4>Business basics</h4>'+[['business','▥','Business'],['add','⬡','＋ Product / service'],['demand','↗','Demand / growth'],['operations','◷','Time / labor'],['cost','▤','Recurring expenses'],['result','◈','Profit & cash']].map(x=>'<button class="palette" data-pick="'+x[0]+'"><i>'+x[1]+'</i><span><strong>'+x[2]+'</strong><small>Edit model assumptions</small></span></button>').join('')+'<h4>Workspace</h4><button class="palette" data-act="import"><i>⇧</i><span><strong>Import JSON</strong></span></button></aside><main class="main">'+(tab==='compare'?compare():tab==='results'?report():graph()+report())+'</main>'+(tab==='build'?editor():'')+'</div><input type="file" id="file" accept=".json,application/json" hidden>'}
function resetRun(){if(timer){clearInterval(timer);timer=null}rows=[];step=0;paused=false;save()}
function run(){resetRun();rows=sim(s);timer=setInterval(()=>{if(paused)return;step++;if(step>=rows.length){clearInterval(timer);timer=null;toast('Simulation complete')}render()},420/speed);render()}
function dl(name,text,mime){var url=URL.createObjectURL(new Blob([text],{type:mime})),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
document.addEventListener('click',e=>{var t=e.target.closest('[data-tab]');if(t){tab=t.dataset.tab;render();return}var pick=e.target.closest('[data-pick]');if(pick){if(pick.dataset.pick==='add'){if(s.offers.length>=15){toast('Limit: 15 offerings');return}var o={...s.offers[0],id:'o'+uid(),name:'New product or service',freq:1,price:100};s.offers.push(o);s.positions[o.id]={x:280+(s.offers.length%2)*220,y:90+((s.offers.length)%3)*130};selected=o.id;resetRun()}else selected=pick.dataset.pick;tab='build';render();return}var btn=e.target.closest('[data-act]');if(!btn)return;var a=btn.dataset.act;if(a==='run')run();if(a==='pause'){paused=!paused;render()}if(a==='stop'){if(timer)clearInterval(timer);timer=null;render()}if(a==='duplicate'){var copy=JSON.parse(JSON.stringify(s));copy.id=uid();copy.name=s.name+' copy';data.scenarios.push(copy);s=copy;selected='business';tab='build';resetRun();render()}if(a==='export')dl('bizbench-'+s.name.replace(/[^a-z0-9]+/gi,'-')+'.json',JSON.stringify({product:'BizBench',scenario:s},null,2),'application/json');if(a==='import')document.getElementById('file').click();if(a==='add-cost'){s.costs.push({id:'c'+uid(),name:'New cost',amount:0,period:'monthly'});resetRun();render()}if(a==='delete-cost'){s.costs=s.costs.filter(x=>x.id!==btn.dataset.id);resetRun();render()}if(a==='delete-offer'){if(s.offers.length===1){toast('Keep one product or service');return}if(confirm('Remove this offering?')){s.offers=s.offers.filter(x=>x.id!==selected);selected=s.offers[0].id;resetRun();render()}}if(a==='csv'){var keys=['month','units','revenue','variable','fixed','payroll','ownerPay','tax','profit','cash','hours','fuel'];dl('bizbench-results.csv',[keys.join(',')].concat(rows.slice(0,step).map(x=>keys.map(k=>x[k]).join(','))).join('\n'),'text/csv')}});
document.addEventListener('change',async e=>{var x=e.target;if(x.id==='scenario'){if(timer)clearInterval(timer);timer=null;s=data.scenarios.find(y=>y.id===x.value);selected=s.offers[0].id;rows=[];step=0;tab='build';render();return}if(x.id==='file'){try{var j=JSON.parse(await x.files[0].text()),v=j.scenario||j;if(!v.business||!Array.isArray(v.offers)||!Array.isArray(v.costs))throw Error('missing fields');v.id=uid();v.name=String(v.name||'Imported scenario')+' imported';v.positions=v.positions||start().positions;data.scenarios.push(v);s=v;selected=v.offers[0].id;resetRun();render();toast('Scenario imported')}catch(err){toast('Invalid scenario JSON')}return}if(!x.dataset.path)return;var obj=x.dataset.path==='business'?s.business:s.offers.find(o=>o.id===x.dataset.path)||s.costs.find(c=>c.id===x.dataset.path);if(!obj)return;var val=x.type==='number'?Number(x.value):x.value;if(x.type==='number'&&(!Number.isFinite(val)||val<0)){toast('Enter a nonnegative number');render();return}if(x.dataset.key==='capacity')val=val==='true';obj[x.dataset.key]=val;resetRun();render()});
var drag=null;document.addEventListener('pointerdown',e=>{var el=e.target.closest('.node');if(!el)return;e.preventDefault();var id=el.dataset.node,p=s.positions[id];drag={id,el,x:e.clientX,y:e.clientY,ox:p.x,oy:p.y};el.setPointerCapture(e.pointerId);selected=id;document.querySelectorAll('.node').forEach(n=>n.classList.toggle('sel',n.dataset.node===id));var aside=document.querySelector('.inspector');if(aside)aside.outerHTML=editor()});document.addEventListener('pointermove',e=>{if(!drag)return;var x=Math.max(10,Math.min(900,drag.ox+e.clientX-drag.x)),y=Math.max(10,Math.min(445,drag.oy+e.clientY-drag.y));s.positions[drag.id]={x:x,y:y};drag.el.style.left=x+'px';drag.el.style.top=y+'px'});document.addEventListener('pointerup',()=>{if(drag){drag=null;save();render()}});
render();
})();
</script></body></html>
