name: Verify and deploy BizBench
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: github-pages
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check BizBench inline JavaScript syntax
        run: |
          python3 - <<'PY'
          from html.parser import HTMLParser
          from pathlib import Path
          class Extract(HTMLParser):
              inside = False
              scripts = []
              def handle_starttag(self, tag, attrs):
                  if tag == "script" and not dict(attrs).get("src"):
                      self.inside = True
              def handle_endtag(self, tag):
                  if tag == "script": self.inside = False
              def handle_data(self, data):
                  if self.inside: self.scripts.append(data)
          parser = Extract()
          parser.feed(Path("index.html").read_text(encoding="utf-8"))
          assert parser.scripts, "BizBench script missing"
          Path("/tmp/bizbench-check.js").write_text("\n".join(parser.scripts), encoding="utf-8")
          PY
          node --check /tmp/bizbench-check.js
  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Stage BizBench public app
        run: |
          mkdir -p dist
          cp index.html dist/
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deployment
        uses: actions/deploy-pages@v4
